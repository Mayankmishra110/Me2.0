# Copy to config/config.yaml (gitignored). Secrets go in .env, not here.
data_dir: ../data
timezone: Asia/Kolkata          # Mayank's time zone for summaries

queue:
  heavy_workers: 1              # render, TTS, STT, local LLM (16 GB RAM)
  light_workers: 4
  net_workers: 2
  heavy_window: "00:00-08:00"   # preferred render window (IST); heavy jobs still run outside it if the queue is idle

telegram:
  daily_summary_at: "22:30"

dashboard:
  listen: ["127.0.0.1:7070", "tailscale:7070"]   # "tailscale" resolves to this machine's tailnet IP

llm:
  providers:
    ollama:     { kind: ollama, base_url: "http://127.0.0.1:11434", model: "TBD-8b-instruct-q4", embed_model: "nomic-embed-text" }
    groq:       { kind: openai_compat, base_url: "https://api.groq.com/openai/v1", key_env: GROQ_API_KEY, model: "TBD" }
    cerebras:   { kind: openai_compat, base_url: "https://api.cerebras.ai/v1", key_env: CEREBRAS_API_KEY, model: "TBD" }
    openrouter: { kind: openai_compat, base_url: "https://openrouter.ai/api/v1", key_env: OPENROUTER_API_KEY, model: "TBD:free" }
    # Gemini free tier (M2-114, CONTEXT D24 — "one free key must work end to end").
    # base_url is Google's documented OpenAI-compatibility endpoint. model id verified
    # 2026-09-28 against ai.google.dev/gemini-api/docs/openai (the OpenAI-compat quickstart's
    # own example model) and ai.google.dev/gemini-api/docs/pricing (listed "free of charge"
    # up to the free-tier rate limit; billing must stay disabled on the Google Cloud project
    # for the key to actually be free). Re-check these pages before bumping this id — Google
    # ships new Gemini point releases often and retires old ones (e.g. 2.0 Flash retired
    # 2026-03-03).
    # embed_model: Gemini's embeddings model id, verified 2026-10-01 against
    # ai.google.dev/gemini-api/docs/openai (the OpenAI-compat guide documents
    # POST {base_url}/embeddings alongside /chat/completions) and
    # ai.google.dev/gemini-api/docs/embeddings (gemini-embedding-001 is the
    # current embeddings model; the free tier's rate limit applies the same
    # way as the chat model above). Re-check both pages before bumping this
    # id. Vectors from this model are NOT comparable to nomic-embed-text
    # vectors (different dimensionality/semantics) — script_fingerprints
    # rows store the embed_model alongside each vector so G2 (compliance
    # originality gate) only ever compares same-model vectors; see CONTEXT
    # D25 / M2-124. Thresholds (G2MaxCosine etc., COMPLIANCE §3) were tuned
    # for nomic-embed-text and have NOT been re-tuned for gemini-embedding-001
    # — flagged in CONTEXT.md §5 open questions.
    gemini:     { kind: openai_compat, base_url: "https://generativelanguage.googleapis.com/v1beta/openai", key_env: GEMINI_API_KEY, model: "gemini-3.8-flash", embed_model: "gemini-embedding-001" }
    claude:     { kind: claude_cli, bin: "claude" }
  routes:
    # Every content route below resolves with GEMINI_API_KEY alone (CONTEXT
    # D25 / M2-124: Ollama will not be installed on this machine). ollama/groq
    # stay first where present as the cheaper/local-first choice (CONTEXT
    # D13) — they're skipped cleanly when not configured (D24) and gemini
    # still resolves the chain.
    research:          [groq, cerebras, openrouter, gemini, ollama]
    script:            [groq, cerebras, openrouter, gemini, ollama]
    metadata:          [ollama, groq, gemini]
    classify:          [ollama, groq, gemini]
    translate_cleanup: [ollama, gemini]
    # embed: llm.Router.Embed's own route (not a Task/Complete route). Local
    # Ollama nomic-embed-text first when installed, Gemini's openai_compat
    # /embeddings endpoint otherwise — the only embedding path the G2
    # originality gate needs with no Ollama installed (CONTEXT D25 / M2-124).
    embed:             [ollama, gemini]
    blog:              [claude]
    builder:           [claude]

content:
  channels_dir: channels        # config/channels/*.yaml
  ramp_up: true                 # COMPLIANCE.md §4
  retention_days: 7

builder:
  enabled: false                # turned on in P5
  implementer_model: claude-opus-5-5
  auditor_model: claude-sonnet-5
  max_fix_attempts: 3
  run_timeout: 60m
  limit_pause: 30m
  repos: []                     # filled once Mayank answers CONTEXT.md open question 1

# blog: the whole section is optional (CONTEXT D24). Leave repo_path empty
# (or delete this section) to run mayank2 with the blog pipeline off — M2-117
# wires blog.draft/blog.merge/blog.repurpose but does not register them when
# repo_path is empty (cmd/mayank2/run.go registerBlogHandlers logs
# "blog not configured" and moves on; the daemon still starts).
# blog:
#   repo_path: "../Mayankbuilt"        # local clone of the Mayankbuilt repo; must already exist with a remote
#   posts_dir: content/blog            # MDX posts directory inside that repo
#   base_branch: main
#   remote: origin
#   channel_id: blog                   # channels.id row for blog content_items (seed it — see internal/blog doc comment)
#   site_base_url: "https://mayankbuilt.com"
#   git_timeout: 2m
#   backlog_path: config/blog-topics.md
#   preview_url_template: ""           # unconfirmed Vercel preview URL shape; leave empty until verified
